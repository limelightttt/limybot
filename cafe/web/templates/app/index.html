<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ cafe.name }}</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/app.css">
<style>:root { --brand: {{ cafe.brand_color }}; }</style>
</head>
<body>
<header class="hero"{% if cafe.cover %} style="background-image: url('/media/{{ cafe.cover }}')"{% endif %}>
  <div class="hero-shade"></div>
  <button class="lang" id="lang" type="button"></button>
  <div class="hero-body">
    {% if cafe.logo %}<img class="logo" src="/media/{{ cafe.logo | thumb }}" alt="">{% endif %}
    <div>
      <h1>{{ cafe.name }}</h1>
      <p id="status"></p>
    </div>
  </div>
</header>
<main id="view"></main>
<div class="sheet" id="sheet" hidden><div class="sheet-backdrop" data-close></div><div class="sheet-body" id="sheet-body"></div></div>
<div class="toast" id="toast" hidden></div>
<script id="data" type="application/json">{{ data | tojson }}</script>
<script src="/static/app.js"></script>
</body>
</html>
