<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Заведения{% endblock %} · limybot</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<style>:root { --accent: #24201c; --on-accent: #ffffff; }</style>
</head>
<body>
<header>
  <a class="brand" href="/ops"><strong>limybot · панель оператора</strong></a>
  {% if request.cookies.get("ops") %}
  <div class="header-actions"><form method="post" action="/ops/logout"><button class="ghost">Выйти</button></form></div>
  {% endif %}
</header>
<main>
  {% if msg %}<p class="flash">{{ msg }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
  // "Скопировать" next to links the operator sends to owners
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const field = document.getElementById(b.dataset.copy);
    field.select();
    try { await navigator.clipboard.writeText(field.value); } catch { document.execCommand("copy"); }
    b.textContent = "Скопировано ✓";
  });
</script>
</body>
</html>
