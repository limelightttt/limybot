<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cafe.name if cafe else "Вход" }}{% endblock %} · админка</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
{% if cafe %}
<header>
  <strong>{{ cafe.name }}</strong>
  <form method="post" action="/logout"><button class="link">Выйти</button></form>
</header>
<nav>
  {% set here = request.url.path %}
  <a href="/orders" {% if here.startswith("/orders") %}class="on"{% endif %}>Заказы</a>
  <a href="/menu" {% if here.startswith("/menu") or here.startswith("/items") %}class="on"{% endif %}>Меню</a>
  <a href="/modifiers" {% if here.startswith("/modifiers") %}class="on"{% endif %}>Добавки</a>
  <a href="/settings" {% if here.startswith("/settings") %}class="on"{% endif %}>Настройки</a>
</nav>
{% endif %}
<main>
  {% if msg %}<p class="flash">{{ msg }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
